services:
  app:
    build: .
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      SW_DB_HOST: db
      SW_DB_NAME: shadow_workspace
      SW_DB_USER: shadow_dev
      SW_DB_PASSWORD: local-development-only
      SW_FORCE_HTTPS: '0'
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: shadow_workspace
      MARIADB_USER: shadow_dev
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-root-development-only
    volumes:
      - shadow-db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  shadow-db:
